# ===================================================================
# Redis for Likha: the "chatbot" and "chatblast" queues (Horizon) and
# the cache and locks (CACHE_STORE=redis). Queued jobs live here, so
# nothing may ever be evicted, and the data must survive a restart.
#
# Install (Ubuntu):  sudo apt-get install -y redis-server
# Then put these lines in /etc/redis/redis.conf (replace the existing
# ones with the same names) and run: sudo systemctl restart redis-server
#
# The password: generate one on the server, e.g.
#   openssl rand -hex 32
# put it on the requirepass line below and in the app env file as
# REDIS_PASSWORD. Never print it in a log, chat or ticket.
# ===================================================================

# Local connections only: the app runs on the same server.
bind 127.0.0.1 -::1
protected-mode yes
port 6379

# The password (the same value as REDIS_PASSWORD in the app's env file).
requirepass CHANGE_ME_ON_THE_SERVER

# Queued jobs survive a restart: write every change to the append-only file.
appendonly yes
appendfsync everysec

# 1 GB, and never evict: a full Redis refuses new writes (an error the
# app logs) instead of silently dropping queued jobs or locks.
maxmemory 1gb
maxmemory-policy noeviction

# Run under systemd.
supervised systemd
