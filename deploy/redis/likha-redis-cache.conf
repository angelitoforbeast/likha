# ===================================================================
# Redis for Likha, instance 2 of 2 (port 6380): the cache DATA only
# (CACHE_STORE=redis: page maps, mock lists, rate limiters, the AI pool
# heartbeat, reports). Some cache keys never expire, so this instance
# evicts the least recently used keys when full; nothing in it is a job
# or a lock (those are on instance 1, port 6379, noeviction).
#
# Ubuntu: the redis-server package has a template service,
# redis-server@<name>, that reads /etc/redis/redis-<name>.conf:
#   sudo cp likha-redis-cache.conf /etc/redis/redis-cache.conf
#   (set requirepass, see below)
#   sudo chown redis:redis /etc/redis/redis-cache.conf
#   sudo systemctl enable --now redis-server@cache
#   redis-cli -p 6380 -a "$REDIS_CACHE_PASSWORD" --no-auth-warning ping    → PONG
# If the template is missing (ls /lib/systemd/system/redis-server@.service),
# run it under Supervisor instead: command=redis-server /etc/redis/redis-cache.conf
# (with "supervised no" and "daemonize no").
#
# The password: its own value (openssl rand -hex 32), in the app env file
# as REDIS_CACHE_PASSWORD. Never print it.
# ===================================================================

bind 127.0.0.1
protected-mode yes
port 6380
requirepass CHANGE_ME_ON_THE_SERVER

# A cache: no need to survive a restart.
appendonly no
save ""

# Full: drop the least recently used keys (never an error to the app).
maxmemory 512mb
maxmemory-policy allkeys-lru

dir /var/lib/redis-cache
pidfile /run/redis-cache/redis-server.pid
logfile /var/log/redis/redis-server-cache.log
supervised systemd