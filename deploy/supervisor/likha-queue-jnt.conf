; ===================================================================
; J&T booking and bulk waybill printing (spec 267): their own queues on
; the database connection, apart from `default` (one shared worker).
;
;   jnt-book   CreateJntOrder, one job per shipment (createBatch,
;              Retry Failed, Retry by date+page). 120 s job timeout,
;              tries 3. Several workers are safe: one worker at a time
;              books a shipment (cache lock + mailno re-read), so J&T is
;              never called twice for one shipment at the same time.
;   jnt-print  BuildJntWaybillBulkPrint, one job per print run. 1800 s
;              job timeout (below retry_after 1900 in config/queue.php,
;              so a run is never handed to a second worker), tries 1.
;   jnt-label  FetchJntLabel (spec 269), one job per booked waybill: fetches
;              its label from J&T (read-only) and keeps it in storage, so a
;              print run only stitches kept labels. 120 s job timeout,
;              tries 4 (released after 1, 3, 10 min when J&T has no label
;              yet, then it stops quietly). J&T label calls across all
;              workers stay at most 20 at once (jnt.labels.max_concurrent).
;
; Deploy to: /etc/supervisor/conf.d/likha-queue-jnt.conf  (on the server)
; Order: release the code first, then
;   sudo supervisorctl reread
;   sudo supervisorctl update
;   sudo supervisorctl status likha-queue-jnt-book: likha-queue-jnt-print: likha-queue-jnt-label:
;   php artisan queue:restart
; Jobs already on `default` at release time still run there, on the old
; default worker (their queue was stored when they were pushed).
;
; After a deploy: php artisan queue:restart (each worker exits after its
; current job; supervisor starts it again with the new code).
; stopwaitsecs is above each job timeout so a stop lets the current job
; finish.
; ===================================================================

[program:likha-queue-jnt-book]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/likha/artisan queue:work database --queue=jnt-book --sleep=1 --tries=3 --timeout=150 --max-time=3600
directory=/var/www/likha
numprocs=3
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=170
user=www-data
redirect_stderr=true
stdout_logfile=/var/log/supervisor/likha-queue-jnt-book.log

[program:likha-queue-jnt-print]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/likha/artisan queue:work database --queue=jnt-print --sleep=1 --tries=1 --timeout=1800 --max-time=3600 --memory=512
directory=/var/www/likha
numprocs=3
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=1820
user=www-data
redirect_stderr=true
stdout_logfile=/var/log/supervisor/likha-queue-jnt-print.log

[program:likha-queue-jnt-label]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/likha/artisan queue:work database --queue=jnt-label --sleep=1 --tries=4 --timeout=120 --max-time=3600
directory=/var/www/likha
numprocs=2
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=140
user=www-data
redirect_stderr=true
stdout_logfile=/var/log/supervisor/likha-queue-jnt-label.log
