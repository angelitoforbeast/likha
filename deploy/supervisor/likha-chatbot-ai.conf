; ===================================================================
; chatbot:ai-pool: the chatbot's AI steps, sent to OpenAI concurrently
; (up to CHATBOT_AI_CONCURRENCY at a time). The chatbot workers no longer
; wait for ChatGPT: each answer comes back as a ResumeChatbotAi job on
; the "chatbot" queue.
;
; Deploy to: /etc/supervisor/conf.d/likha-chatbot-ai.conf  (on the server)
;   sudo supervisorctl reread
;   sudo supervisorctl update
;   sudo supervisorctl status likha-chatbot-ai
;
; numprocs MUST stay 1: a second pool refuses to start (heartbeat), and
; one process already keeps all requests in flight at the same time.
;
; It exits cleanly every hour (--max-time) and supervisor starts it
; again; on stop it waits for the requests in flight (stopwaitsecs 70).
; After a deploy: sudo supervisorctl restart likha-chatbot-ai
;
; Rollback without this process: CHATBOT_AI_ASYNC=false in the env file,
; then php artisan config:cache (the AI step waits again, as before).
; ===================================================================

[program:likha-chatbot-ai]
process_name=%(program_name)s
command=php /var/www/likha/artisan chatbot:ai-pool --max-time=3600
directory=/var/www/likha
autostart=true
autorestart=true
startsecs=5
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/supervisor/likha-chatbot-ai.log
stopsignal=TERM
stopwaitsecs=70
