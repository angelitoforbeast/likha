; ===================================================================
; Incepxion J&T booking (spec 267): its own queue `jnt-book` on the
; database connection, apart from `default` (one shared worker).
;
;   jnt-book   CreateJntOrder, one job per shipment (createBatch,
;              Retry Failed, Retry by date+page). 120 s job timeout,
;              tries 3. Several workers are safe: one worker at a time
;              books a shipment (cache lock + mailno re-read), so J&T is
;              never called twice for one shipment at the same time.
;
; Bulk waybill printing is not used on Incepxion: it stays on `default`
; (config jnt.queues.print), so no print program here.
;
; Deploy to: /etc/supervisor/conf.d/incepxion-queue-jnt.conf  (on the server)
; Order: release the code first, then
;   sudo supervisorctl reread
;   sudo supervisorctl update
;   sudo supervisorctl status incepxion-queue-jnt-book:
;   php artisan queue:restart
; Jobs already on `default` at release time still run there, on the old
; default worker (their queue was stored when they were pushed).
;
; After a deploy: php artisan queue:restart (each worker exits after its
; current job; supervisor starts it again with the new code).
; stopwaitsecs is above the job timeout so a stop lets the current job
; finish.
; ===================================================================

[program:incepxion-queue-jnt-book]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php /var/www/incepxion.pro/artisan queue:work database --queue=jnt-book --sleep=1 --tries=3 --timeout=150 --max-time=3600
directory=/var/www/incepxion.pro
numprocs=3
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=170
user=www-data
redirect_stderr=true
stdout_logfile=/var/log/supervisor/incepxion-queue-jnt-book.log
