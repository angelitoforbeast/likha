; ===================================================================
; Order encode (spec 130): the queue `encode` on the database
; connection. One EncodeOrder job per order of a page whose
; order_encode.mode is `shadow` or `live`: a few OpenAI calls, up to
; 600 s (the job timeout); tries 2, backoff 60 s (set on the job).
;
; Deploy to: /etc/supervisor/conf.d/likha-encode.conf  (on the server)
;   sudo supervisorctl reread
;   sudo supervisorctl update
;   sudo supervisorctl status likha-encode
;
; After a deploy: sudo supervisorctl restart likha-encode:*
; stopwaitsecs is above the job timeout so a restart lets the current
; order finish. No other worker may take the queue `encode`.
; ===================================================================

[program:likha-encode]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/likha/artisan queue:work database --queue=encode --sleep=3 --tries=2 --timeout=600 --max-time=3600
directory=/var/www/likha
numprocs=2
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=620
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/likha/storage/logs/encode-worker.log
