; ===================================================================
; Horizon: the workers of the "chatbot" and "chatblast" queues on Redis
; (config/horizon.php: chatbot 2-16 workers, chatblast 2-8 with
; "chatblast-high" first for Delivering). It replaces the two Supervisor
; groups likha-chatbot and likha-chatblast, only after the cutover
; (docs/specs/088-redis-horizon.result.md). astra, default and the J&T
; queues keep their own groups on the database driver.
;
; Deploy to: /etc/supervisor/conf.d/likha-horizon.conf  (on the server)
;   sudo supervisorctl reread
;   sudo supervisorctl update
;   sudo supervisorctl status likha-horizon
;   php artisan horizon:status        (should say: running)
;
; numprocs MUST stay 1: Horizon starts and scales its own workers.
; After every deploy: php artisan horizon:terminate (supervisor starts
; it again with the new code), next to the existing queue:restart.
; stopwaitsecs is longer than the longest job (320 s), so a stop lets
; running jobs finish.
; ===================================================================

[program:likha-horizon]
process_name=%(program_name)s
command=php /var/www/likha/artisan horizon
directory=/var/www/likha
autostart=true
autorestart=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/supervisor/likha-horizon.log
stopsignal=TERM
stopwaitsecs=330
