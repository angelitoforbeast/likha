; ===================================================================
; botcake:send-pool: the chatbot's send_content and the chatblast
; message steps, sent to Botcake concurrently (up to
; BOTCAKE_SEND_CONCURRENCY at a time) at exactly BOTCAKE_RATE_PER_PAGE
; requests per second per page. Workers no longer wait for Botcake:
; each chatbot result comes back as a ResumeChatbotSend job on the
; "chatbot" queue (088: Horizon); chatblast messages are finished by
; the pool itself.
;
; Deploy to: /etc/supervisor/conf.d/likha-botcake-send.conf  (on the server)
;   sudo supervisorctl reread
;   sudo supervisorctl update
;   sudo supervisorctl status likha-botcake-send
;
; numprocs MUST stay 1: a second pool refuses to start (heartbeat), and
; the per-page rate is exact only because one process decides it.
;
; It exits cleanly every hour (--max-time) and supervisor starts it
; again; on stop it waits for the requests in flight (stopwaitsecs 70).
; After a deploy: sudo supervisorctl restart likha-botcake-send
;
; Rollback without this process: BOTCAKE_ASYNC_SENDS=false in the env
; file, then php artisan config:cache and restart the workers (sends
; wait in the worker again, as before). Stopping the process alone
; also makes new sends wait, within 10 s.
; ===================================================================

[program:likha-botcake-send]
process_name=%(program_name)s
command=php /var/www/likha/artisan botcake:send-pool --max-time=3600
directory=/var/www/likha
autostart=true
autorestart=true
startsecs=5
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/supervisor/likha-botcake-send.log
stopsignal=TERM
stopwaitsecs=70
