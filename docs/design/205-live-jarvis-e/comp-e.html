<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>

#bg{left:0;top:0;width:1920px;height:1080px}
#tk{left:40px;top:1048px;width:1840px;height:28px}
#cam{position:absolute;inset:0;perspective:1500px;perspective-origin:960px 585px}

.rb.v{background:linear-gradient(90deg,rgba(111,216,255,.04),rgba(111,216,255,.30) 55%,rgba(111,216,255,.5))}

<canvas id="bg" width="1920" height="1080"></canvas>
<div id="cam"><div id="world">
 <div class="it pn" id="orb" style="width:700px;height:700px;margin:-350px 0 0 -350px"><canvas id="cv-orb"></canvas><div id="orbhit" tabindex="0" role="group" aria-label="Order value today"></div></div>
</div></div>
<canvas id="tk" width="1840" height="28"></canvas>
<header id="hd">
 <svg width="46" height="36" viewBox="0 0 46 36" aria-hidden="true"><path d="M2 4h34M2 16h42M2 28h26" stroke="#6fd8ff" stroke-width="6" stroke-linecap="round" fill="none"/></svg>
 <h1>LIKHA LIVE</h1><i class="dot" role="img" aria-label="Live"></i>

 <div id="clk" aria-label="Time">11:52:20</div>

<script>
/* Likha Live comp E: "Wall". Visual-first. Deterministic: same time, same frame.
   ?at=2100 freezes mid-loot (PNG).  ?d3=1 starts in the curved-wall view.  No library, no network, no blur/backdrop-filter. */
(()=>{
const Q=new URLSearchParams(location.search),FZ=Q.has('at'),AT=FZ?(+Q.get('at')||0):1500;
const $=id=>document.getElementById(id),TAU=Math.PI*2,lerp=(a,b,k)=>a+(b-a)*k,cl=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,fmt=n=>Math.round(n).toLocaleString('en-US');
const H=(i,s)=>{let x=Math.imul(i+1,374761393)^Math.imul(s+7,668265263);x=Math.imul(x^x>>>13,1274126177);return((x^x>>>16)>>>0)/4294967296};
const FC="'Bahnschrift Condensed','Bahnschrift SemiCondensed','Arial Narrow',sans-serif",FS="'Bahnschrift SemiCondensed','Bahnschrift','Segoe UI',sans-serif";
const st=$('st'),world=$('world');let SC=1,RS=1;
const O={x:960,y:585};
function T(c,s,x,y,font,col,al,ls){c.font=font;c.fillStyle=col;c.textAlign=al||'left';c.letterSpacing=ls||'0px';c.fillText(s,x,y);c.letterSpacing='0px'}
/* glow sprites */
function sprite(rgb){const c=document.createElement('canvas');c.width=c.height=64;const g=c.getContext('2d'),gr=g.createRadialGradient(32,32,0,32,32,32);gr.addColorStop(0,`rgba(${rgb},1)`);gr.addColorStop(.2,`rgba(${rgb},.8)`);gr.addColorStop(.5,`rgba(${rgb},.2)`);gr.addColorStop(1,`rgba(${rgb},0)`);g.fillStyle=gr;g.fillRect(0,0,64,64);return c}
const SG=sprite('93,255,156'),SW=sprite('235,255,245'),SY=sprite('255,194,71'),SCY=sprite('111,216,255'),SA=sprite('255,154,46');
const glow=(c,s,x,y,r,a)=>{c.globalAlpha=a;c.drawImage(s,x-r,y-r,2*r,2*r);c.globalAlpha=1};

/* ---------- simulation (all a pure function of t, ms) ---------- */
const ORD0=400,OP=8000,DEP=300,GAP=150,FLY=1100,AMT=599,V0=62755,O0=261,COIN=[100,100,100,100,100,99];
const LAST=DEP+GAP*5+FLY;
const landed=e=>{let n=0;for(let i=0;i<6;i++)if(e>=DEP+GAP*i+FLY)n++;return n};
function sim(t){
  const n=Math.floor((t-ORD0)/OP),t0=ORD0+OP*n,e=t-t0,l=n<0?0:landed(e);let v=V0,o=O0;
  if(n>=0){v+=AMT*n;o+=n;for(let i=0;i<l;i++)v+=COIN[i];if(l>0)o++}
  let warm=0,bump=0;
  if(n>=0)for(let i=0;i<6;i++){const d=e-(DEP+GAP*i+FLY);if(d>=0){warm+=Math.exp(-d/480);bump+=Math.exp(-d/220)}}
  const sd=e-LAST,shock=n>=0&&sd>=0&&sd<1000?sd/1000:-1,pop=1+(n>=0&&sd>=0&&sd<520?.035*Math.sin(Math.PI*sd/520):0)+.01*Math.min(1,bump);
  const tt=Math.max(0,t);
  return{n,t0,e,v,o,warm:Math.min(1,warm),shock,pop,
   b1in:11582+Math.floor(tt/900),b1out:17893+Math.floor(tt/700),bcin:711+Math.floor(tt/9000),bcout:3+Math.floor(tt/7000),
   ai:9421+Math.floor(tt/2600),fu:22699+Math.floor(tt/3400),rep:17896+Math.floor(tt/1200),
   avg:5.4+.25*Math.sin(tt/3000-.65),sig:801+(Math.floor(tt/2000)%7),act:71+Math.round(2*Math.sin(tt/20000)),
   clock:(11*3600+52*60+20+Math.floor(tt/1000))};
}
/* radar dots: customers chatting in the last 5 minutes. Position = angle (random per customer), radius = minutes since last message */
const LIFE=300000,NAMES=['Maria S.','Liza F.','Jose D.','Jenny R.','Carlo M.','Mark B.','Ana R.','Ryan A.','Joy L.','Ken T.','Grace P.','Paolo V.'];
function getDots(bot,t){
  const sp=bot==='b1'?4400:100000,sd=bot==='b1'?11:29,i1=Math.floor(t/sp),i0=Math.floor((t-LIFE)/sp)+1,out=[];
  for(let i=i0;i<=i1;i++){
    const age=t-i*sp,d={i,age,ang:H(i,sd)*TAU+Math.sin(i+age/9000)*.04,rr:cl(.14+.8*(age/LIFE)+(H(i,sd+1)-.5)*.06,.1,.95),gold:false,ai:H(i,sd+2)<.2,name:NAMES[Math.floor(H(i,sd+5)*NAMES.length)]};
    if(bot==='b1'){const n=Math.ceil(((i*sp+12000)-ORD0)/OP),ot=ORD0+OP*n;if(Math.floor((ot-12000)/sp)===i&&t>=ot&&t-ot<45000){d.gold=true;d.ga=t-ot}}
    else if(((i%3)+3)%3===1){d.gold=true;d.ga=99999}
    out.push(d)}
  return out}
/* ---------- panels ---------- */
const S15=1.45,CR=795,TH=548;
const PN=[
 {id:'b1',cx:306,cy:395,w:540,h:410,or:'L',ins:44,name:'BOT 1'},
 {id:'bc',cx:1614,cy:395,w:540,h:410,or:'R',ins:44,name:'BOTCAKE',mir:1},
 {id:'b2',cx:262,cy:842,w:360,h:250,or:'L',ins:34,name:'BOT 2'},
 {id:'ai',cx:772,cy:190,w:340,h:200,or:'T',ins:36,name:'AI'},
 {id:'fu',cx:1148,cy:190,w:340,h:200,or:'T',ins:36,name:'FOLLOW-UPS'},
 {id:'rp',cx:590,cy:945,w:250,h:190,or:'B',ins:30,name:'REPLIES'},
 {id:'vt',cx:960,cy:945,w:420,h:190,or:'B',ins:34,name:'ORDER VALUE',gd:1},
 {id:'av',cx:1330,cy:945,w:250,h:190,or:'B',ins:30,name:'AVG REPLY'},
 {id:'ac',cx:1658,cy:842,w:360,h:250,or:'R',ins:34,name:'CHATS'}];
for(const p of PN){
  p.dx=p.cx-O.x;p.dy=p.cy-O.y;p.th=p.dx/TH;
  const m=Math.hypot(p.dx,p.dy),ux=-p.dx/m,uy=-p.dy/m,hw=p.w/2,hh=p.h/2;
  if(p.or==='L'){p.ax=hw-3;p.ay=cl(uy*hw/Math.abs(ux),-(hh-p.ins-8),hh-p.ins-8)}
  else if(p.or==='R'){p.ax=-hw+3;p.ay=cl(uy*hw/Math.abs(ux),-(hh-p.ins-8),hh-p.ins-8)}
  else if(p.or==='T'){p.ay=hh-3;p.ax=cl(ux*hh/Math.abs(uy),-(hw-p.ins-8),hw-p.ins-8)}
  else{p.ay=-hh+3;p.ax=cl(ux*hh/Math.abs(uy),-(hw-p.ins-8),hw-p.ins-8)}
  const el=document.createElement('div');el.className='it pn';el.tabIndex=0;el.setAttribute('role','group');el.setAttribute('aria-label',p.name);
  el.style.cssText=`width:${p.w}px;height:${p.h}px;margin:${-p.h/2}px 0 0 ${-p.w/2}px`;
  p.cv=document.createElement('canvas');el.appendChild(p.cv);world.appendChild(el);p.el=el;
  el.addEventListener('pointerenter',()=>showTip(p));el.addEventListener('pointerleave',hideTip);el.addEventListener('focus',()=>showTip(p));el.addEventListener('blur',hideTip);el.addEventListener('click',()=>showTip(p));
}
const PM={};PN.forEach(p=>PM[p.id]=p);
/* spokes: two crossed ribbons (one is edge-on in 2D), each carrying packets */
const STREAMS={b1:[{d:-1,per:900,tr:1300,c:'#e9fbff'},{d:1,per:700,tr:1300,c:'#35c8ff'}],bc:[{d:-1,per:9000,tr:1600,c:'#e9fbff'},{d:1,per:7000,tr:1600,c:'#35c8ff'}],
 ai:[{d:1,per:2600,tr:1500,c:'#6fd8ff'}],fu:[{d:1,per:3400,tr:1500,c:'#6fd8ff'}],rp:[{d:1,per:1200,tr:1400,c:'#35c8ff'}],av:[{d:-1,per:2800,tr:1500,c:'#e9fbff'}],ac:[{d:-1,per:3000,tr:1500,c:'#5dff9c'}],b2:[],vt:[]};
const SPK=[];
for(const p of PN){
  const s={p,L:0,rb:[],pk:[[],[]],st:STREAMS[p.id]};
  for(let r=0;r<2;r++){const d=document.createElement('div');d.className='rb '+(r?'b ':'')+(p.id==='b2'?'dm':p.id==='vt'?'gd':'v');
    for(let i=0;i<s.st.length*3;i++){const k=document.createElement('i');k.className='pk';d.appendChild(k);s.pk[r].push(k)}
    world.insertBefore(d,world.firstChild);s.rb.push(d)}
  SPK.push(s)}
/* coins */
const COINS=[];for(let i=0;i<6;i++){const d=document.createElement('div');d.className='coin';d.textContent='₱';world.appendChild(d);COINS.push(d)}
/* ---------- layout (2D wall <-> cylinder wall) ---------- */
let K=Q.has('d3')?1:0,want=K,ORB=0,TILT=0;
function toWorld(p,lx,ly){const M=p.M,c=Math.cos(M.rot),s=Math.sin(M.rot);return[M.X+M.sc*lx*c,M.Y+M.sc*ly,M.Z-M.sc*lx*s]}
function layout(t){
  ORB=7*Math.sin(t/9500+4.0);TILT=4+2*Math.sin(t/7000);
  world.style.transform=`translateY(${(2*K).toFixed(1)}px) translateZ(${(-240*K).toFixed(1)}px) rotateX(${(TILT*K).toFixed(2)}deg) rotateY(${(ORB*K).toFixed(2)}deg)`;
  for(const p of PN){
    const X=lerp(p.dx,CR*Math.sin(p.th),K),Y=lerp(p.dy,p.dy*S15,K),Z=lerp(0,-CR*Math.cos(p.th),K),rot=-p.th*K,sc=lerp(1,S15,K);
    p.M={X,Y,Z,rot,sc};p.el.style.transform=`translate3d(${X.toFixed(2)}px,${Y.toFixed(2)}px,${Z.toFixed(2)}px) rotateY(${rot.toFixed(4)}rad) scale(${sc.toFixed(4)})`}
  for(const s of SPK){
    const P=toWorld(s.p,s.p.ax,s.p.ay),len=Math.hypot(...P),u=P.map(v=>v/len),r0=236;
    const P0=u.map(v=>v*r0),E=P.map((v,i)=>v-u[i]*5),d=E.map((v,i)=>v-P0[i]),L=Math.hypot(...d),a=d.map(v=>v/L);
    const w=Math.abs(a[2])<.8?[0,0,1]:[0,1,0];let v1=[a[1]*w[2]-a[2]*w[1],a[2]*w[0]-a[0]*w[2],a[0]*w[1]-a[1]*w[0]];const m1=Math.hypot(...v1);v1=v1.map(v=>v/m1);
    const n1=[a[1]*v1[2]-a[2]*v1[1],a[2]*v1[0]-a[0]*v1[2],a[0]*v1[1]-a[1]*v1[0]];
    if(Math.abs(L-s.L)>.5){s.L=L;s.rb[0].style.width=s.rb[1].style.width=L+'px'}
    s.rb[0].style.transform=`matrix3d(${a[0]},${a[1]},${a[2]},0,${v1[0]},${v1[1]},${v1[2]},0,${n1[0]},${n1[1]},${n1[2]},0,${P0[0]},${P0[1]},${P0[2]},1)`;
    s.rb[1].style.transform=`matrix3d(${a[0]},${a[1]},${a[2]},0,${n1[0]},${n1[1]},${n1[2]},0,${-v1[0]},${-v1[1]},${-v1[2]},0,${P0[0]},${P0[1]},${P0[2]},1)`;
    s.rb[1].style.opacity=cl(K*1.6)}
}
function packets(t){
  for(const s of SPK){let j=0;for(const q of s.st){for(let m=0;m<3;m++){
    const idx=Math.floor(t/q.per)-m,p=(t-idx*q.per)/q.tr,on=p>=0&&p<1;
    for(let r=0;r<2;r++){const k=s.pk[r][j];if(!on){k.style.opacity=0;continue}
      const pp=q.d>0?p:1-p,al=Math.sin(Math.PI*p)**.5;
      k.style.opacity=al.toFixed(2);k.style.background=`linear-gradient(${q.d>0?90:270}deg,transparent,${q.c})`;
      k.style.transform=`translateX(${(pp*s.L).toFixed(1)}px)`}
    j++}}}
}
/* ---------- drawing ---------- */
function rpath(c,pts,r){const n=pts.length;c.beginPath();for(let i=0;i<n;i++){const a=pts[(i+n-1)%n],b=pts[i],d=pts[(i+1)%n];const m0=[(a[0]+b[0])/2,(a[1]+b[1])/2],m2=[(b[0]+d[0])/2,(b[1]+d[1])/2];if(!i)c.moveTo(m0[0],m0[1]);c.arcTo(b[0],b[1],m2[0],m2[1],r)}c.closePath()}
function shape(p,sh){const{w,h,ins:i}=p;let q=p.or==='L'?[[0,0],[w,i],[w,h-i],[0,h]]:p.or==='R'?[[0,i],[w,0],[w,h],[0,h-i]]:p.or==='T'?[[0,0],[w,0],[w-i,h],[i,h]]:[[i,0],[w-i,0],[w,h],[0,h]];
  if(sh){const k=(w-2*sh)/w,j=(h-2*sh)/h;q=q.map(a=>[sh+a[0]*k,sh+a[1]*j])}return q}
function frame(c,p,t){
  const {w,h}=p;c.clearRect(0,0,w,h);rpath(c,shape(p,2),24);
  const G=p.gd,g=c.createLinearGradient(0,0,w,h);g.addColorStop(0,G?'rgba(255,190,70,.20)':'rgba(60,196,245,.20)');g.addColorStop(1,G?'rgba(190,110,20,.10)':'rgba(20,110,170,.09)');c.fillStyle=g;c.fill();
  c.lineWidth=2;c.strokeStyle=G?'rgba(255,194,71,.7)':'rgba(111,216,255,.62)';c.stroke();
  rpath(c,shape(p,12),16);c.lineWidth=1;c.strokeStyle=G?'rgba(255,194,71,.2)':'rgba(111,216,255,.16)';c.stroke();
  /* a bright dash crawls round the edge */
  rpath(c,shape(p,2),24);const per=2*(w+h);c.setLineDash([90,per]);c.lineDashOffset=-((t*.09+p.dx*.7)%per+per)%per;c.lineWidth=3;c.strokeStyle='rgba(200,245,255,.9)';c.stroke();c.setLineDash([]);
}
function radarBase(c,cx,cy,R,dim){
  const g=c.createRadialGradient(cx,cy,0,cx,cy,R);g.addColorStop(0,`rgba(40,150,200,${dim?.06:.2})`);g.addColorStop(1,`rgba(10,70,110,${dim?.12:.4})`);
  c.fillStyle=g;c.beginPath();c.arc(cx,cy,R,0,TAU);c.fill();
  if(dim)c.setLineDash([5,8]);
  c.strokeStyle=`rgba(111,216,255,${dim?.2:.26})`;c.lineWidth=1.2;for(const f of[.25,.5,.75]){c.beginPath();c.arc(cx,cy,R*f,0,TAU);c.stroke()}

 case'b1':return[['Bot 1 · Forbeast','Connected'],['In',m(S.b1in)],['Out',m(S.b1out)],['Chatting now',68],['AI answered',m(S.ai-3)],['Avg reply',S.avg.toFixed(1)+' s'],['Orders today',S.o-2],['Order value','₱'+m(S.v-599)],['Last activity','Inquiry · Sample Page 12 · 11:52']];
 case'bc':return[['Botcake · Fallback','Connected'],['In',m(S.bcin)],['Out',m(S.bcout)],['Chatting now',3],['AI answered',3],['Orders today',2],['Order value','₱599'],['Last activity','Inquiry · Sample Page 15 · 11:49']];
 case'b2':return[['Bot 2 · Inceptionbot','Not linked'],['In',0],['Out',0]];
 case'ai':return[['AI answers',''],['Today',m(S.ai)],['Lit cells','answers, last minute']];
 case'fu':return[['Follow-ups sent',m(S.fu)],['Preorder Sequence','14,210'],['Abandoned Cart','5,871'],['Restock Notice','2,618']];
 case'rp':return[['Replies today',m(S.rep)],['Last 5 min','+222'],['White tick','same hour yesterday']];
 case'av':return[['Avg reply time',S.avg.toFixed(1)+' s'],['Measures','customer sent → reply sent'],['Bot','Bot 1 only']];
 case'ac':return[['Active chats',S.act],['Window','last 5 min'],['Bot 1 / Botcake','68 / 3']];
 case'vt':return[['Order value today · COD','₱'+m(S.v)],['Orders today',S.o],['In the last 5 min','+3'],['Last order','Sample Page 07 · 11:52 · Bot 1'],['One coin disc','₱6,000']];
 default:return[['Likha bot','Core'],['Signals, last 5 min',S.sig],['Inquiries received today','12,293'],['Active chats',S.act]]}}
let tipId=null,tipEl=null,tipS=null;
function paintTip(){if(!tipId)return;const R=rowsFor(tipId,tipS);tip.innerHTML=R.map((r,i)=>`<div${i?'':' class="h"'}><span>${r[0]}</span><b>${r[1]}</b></div>`).join('')}
function showTip(p){tipId=p.id;tipEl=p.el;paintTip();tip.classList.add('on');placeTip()}
function showOrb(){tipId='orb';tipEl=$('orbhit');paintTip();tip.classList.add('on');placeTip()}
function placeTip(){const r=tipEl.getBoundingClientRect(),w=tip.offsetWidth,h=tip.offsetHeight;let x=(r.left+r.right)/2<innerWidth/2?r.right:r.left-w*SC;let y=r.top;x=(x-(innerWidth-1920*SC)/2)/SC;y=(y-(innerHeight-1080*SC)/2)/SC;if(r.left+r.width/2>=innerWidth/2)x-=0;x=cl(x,20,1900-w);y=cl(y,84,1060-h);tip.style.left=x+'px';tip.style.top=y+'px'}
function hideTip(){tipId=null;tip.classList.remove('on')}
$('orbhit').addEventListener('pointerenter',showOrb);$('orbhit').addEventListener('pointerleave',hideTip);$('orbhit').addEventListener('focus',showOrb);$('orbhit').addEventListener('blur',hideTip);$('orbhit').addEventListener('click',showOrb);
/* ---------- controls ---------- */
$('b3').onclick=e=>{want=want?0:1;e.currentTarget.setAttribute('aria-pressed',want?'true':'false')};
$('bfl').onclick=e=>{const o=$('fp').classList.toggle('on');e.currentTarget.setAttribute('aria-expanded',o)};
$('btv').onclick=()=>{st.classList.toggle('tv');const d=document.documentElement;if(st.classList.contains('tv')&&d.requestFullscreen)d.requestFullscreen().catch(()=>{})};
addEventListener('keydown',e=>{if(e.key==='Escape'){st.classList.remove('tv');hideTip()}});
/* ---------- boot / loop ---------- */
function alloc(){for(const p of PN){p.cv.width=Math.round(p.w*RS);p.cv.height=Math.round(p.h*RS);p.c=p.cv.getContext('2d');p.c.setTransform(RS,0,0,RS,0,0)}
  const o=$('cv-orb');o.width=o.height=Math.round(700*RS);o.c=o.getContext('2d');o.c.setTransform(RS,0,0,RS,0,0);
  const k=$('tk');k.width=Math.round(1840*RS);k.height=Math.round(28*RS);k.getContext('2d').setTransform(RS,0,0,RS,0,0)}
function fit(){SC=Math.min(innerWidth/1920,innerHeight/1080);st.style.transform=`translate(${(innerWidth-1920*SC)/2}px,${(innerHeight-1080*SC)/2}px) scale(${SC})`;RS=Math.min(2,Math.max(1,(devicePixelRatio||1)*SC));alloc();dBg()}
function clock(s){const h=Math.floor(s/3600)%24,m=Math.floor(s/60)%60;return[h,m,s%60].map(v=>String(v).padStart(2,'0')).join(':')}
function draw(t){
  const S=sim(t);
  dBot(PM.b1.c,PM.b1,t,S);dBot(PM.bc.c,PM.bc,t,S);dB2(PM.b2.c,PM.b2,t);dAI(PM.ai.c,PM.ai,t,S);dFU(PM.fu.c,PM.fu,t,S);dRep(PM.rp.c,PM.rp,t,S);dAvg(PM.av.c,PM.av,t,S);dAct(PM.ac.c,PM.ac,t,S);dVault(PM.vt.c,PM.vt,t,S);
  S.pass=0;if(S.n>=0)for(let i=0;i<6;i++){const p=(S.e-DEP-GAP*i)/FLY;if(p>0&&p<1)S.pass=Math.max(S.pass,Math.exp(-Math.pow((p-.5)/.09,2)))}
  dOrb($('cv-orb').c,t,S);dTk(t);$('clk').textContent=clock(S.clock);tipS=S;if(tipId)paintTip();
  /* coins fly from the gold blip in Bot 1 into the globe */
  const p1=PM.b1;
  for(let i=0;i<6;i++){const el=COINS[i];const d=DEP+GAP*i,p=S.n>=0?(S.e-d)/FLY:-1;
    if(p<0||p>=1){el.style.opacity=0;continue}
    const dots=getDots('b1',S.t0),g=dots.find(x=>x.gold&&x.ga<1);const R=142,cx=176,cy=222;
    let sx=cx-p1.w/2,sy=cy-p1.h/2;if(g){sx=cx+R*g.rr*Math.cos(g.ang)-p1.w/2;sy=cy+R*g.rr*Math.sin(g.ang)-p1.h/2}
    const A=toWorld(p1,sx,sy),vy=168-Math.min(Math.floor(S.v/6000),13)*11-12,V=toWorld(PM.vt,88-PM.vt.w/2,vy-PM.vt.h/2),q=eio(p);
    const Cc=[-(A[0]+V[0])/2,-(A[1]+V[1])/2,60-(A[2]+V[2])/2],pos=[0,1,2].map(j=>(1-q)*(1-q)*A[j]+2*(1-q)*q*Cc[j]+q*q*V[j]);
    const sc=(.75+.3*Math.sin(Math.PI*p)),fl=Math.cos(p*TAU*2.5);
    el.style.opacity=p>.97?(1-p)/.03:1;el.style.transform=`translate3d(${pos[0].toFixed(1)}px,${pos[1].toFixed(1)}px,${pos[2].toFixed(1)}px) rotateY(${(-ORB*K).toFixed(2)}deg) scale(${sc.toFixed(3)}) scaleX(${(Math.abs(fl)*.85+.15).toFixed(3)})`}
}
fit();addEventListener('resize',()=>{fit();if(FZ){layout(AT);draw(AT)}});
if(FZ){layout(AT);draw(AT);packets(AT)}
else{let T0=performance.now(),last=0;const loop=now=>{const t=AT+(now-T0);K+=(want-K)*.06;if(Math.abs(want-K)<.002)K=want;layout(t);packets(t);if(now-last>=33){draw(t);last=now}requestAnimationFrame(loop)};requestAnimationFrame(loop)}
})();
