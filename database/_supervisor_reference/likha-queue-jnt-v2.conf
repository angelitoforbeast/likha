; ===================================================================
; Reference Supervisor configuration for JNT V2 producer-consumer setup.
;
; Deploy to: /etc/supervisor/conf.d/likha-queue-jnt-v2.conf  (on server)
;
; After editing on server:
;   sudo supervisorctl reread
;   sudo supervisorctl update
;
; To verify:
;   sudo supervisorctl status | grep jnt-v2
;
; ARCHITECTURE:
;   - 3 PARSERS  on jnt_v2_parse  → read XLSX, write CSV file
;   - 1 LOADER   on jnt_v2_load   → LOAD DATA INFILE → from_jnts_2_staging
;
;   Total V2 workers = 4 (matches 4-core server CPU nicely).
;   Producer-consumer model = zero deadlock by design.
; ===================================================================

; -------------------------------------------------------------------
; PARSER pool (3 workers, parallel XLSX → CSV)
; -------------------------------------------------------------------
[program:likha-queue-jnt-v2-parse]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/likha/artisan queue:work --queue=jnt_v2_parse --sleep=3 --tries=1 --timeout=1800 --max-time=3600 --memory=512
directory=/var/www/likha
autostart=true
autorestart=true
user=www-data
numprocs=3
redirect_stderr=true
stdout_logfile=/var/log/supervisor/likha-queue-jnt-v2-parse.log
stopwaitsecs=1810

; -------------------------------------------------------------------
; LOADER (1 worker, serial CSV → LOAD DATA INFILE → DB)
; CRITICAL: numprocs=1. Maraming worker = balik deadlock issue.
; -------------------------------------------------------------------
[program:likha-queue-jnt-v2-load]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/likha/artisan queue:work --queue=jnt_v2_load --sleep=2 --tries=3 --timeout=600 --max-time=3600 --memory=256
directory=/var/www/likha
autostart=true
autorestart=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/supervisor/likha-queue-jnt-v2-load.log
stopwaitsecs=610

; ===================================================================
; SERVER PRE-FLIGHT CHECKLIST (run before deploying):
;
; 1. MySQL must allow LOCAL INFILE:
;    mysql -u root -p -e "SHOW GLOBAL VARIABLES LIKE 'local_infile';"
;    Expected: local_infile = ON
;
;    If OFF, add to /etc/mysql/mysql.conf.d/mysqld.cnf:
;       [mysqld]
;       local_infile = 1
;    Then: sudo systemctl restart mysql
;
; 2. CSV scratch directory must exist and be writable by www-data:
;    sudo mkdir -p /var/www/likha/storage/app/jnt_v2_csv
;    sudo chown www-data:www-data /var/www/likha/storage/app/jnt_v2_csv
;    sudo chmod 775 /var/www/likha/storage/app/jnt_v2_csv
;
; 3. Old supervisor config likha-queue-jnt-v2-parse may have had numprocs=5.
;    This new config sets it to 3. After `supervisorctl update`, the extra
;    workers will be stopped automatically.
;
; 4. Verify Laravel config loaded the LOCAL_INFILE PDO option:
;    php /var/www/likha/artisan tinker
;    >>> DB::connection()->getPdo()->getAttribute(PDO::MYSQL_ATTR_LOCAL_INFILE);
;    Expected: 1 (or true)
;
; 5. After deploy, smoke test: upload 1 small file via /jnt_upload_v2.
;    Watch logs:
;      sudo tail -f /var/log/supervisor/likha-queue-jnt-v2-parse.log
;      sudo tail -f /var/log/supervisor/likha-queue-jnt-v2-load.log
; ===================================================================
